<!-- Contingut principal de la pàgina d'inici -->
<main class="bg-linear-to-b from-stone-900 via-stone-800 to-amber-900">

  <app-hero/>

  <!-- Tipus -->
  <section id="tipus" class="scroll-mt-28 mx-auto max-w-5xl p-8 py-12">
    <h2 class="mb-8 text-center text-3xl font-bold text-amber-300">Els tipus principals</h2>
    <div class="grid gap-6 sm:grid-cols-2 md:grid-cols-3">
      @for(tipus of tipusPokemon; track tipus.nom) {
        <app-tipus-targeta [tipus]="tipus"/>
      }
    </div>
  </section>

  <!-- Sobre Nosaltres -->
  <section id="nosaltres" class="scroll-mt-28">
    <div class="mx-auto max-w-3xl p-8 py-12 text-center">
      <h2 class="text-3xl font-bold text-amber-300">Sobre Nosaltres</h2>
      <p class="mt-4 text-stone-200">És una web de fans i no és oficial. Serveix per tenir a mà els tipus de Pokémon i recordar què és fort i què és feble contra què quan jugo.</p>
    </div>
  </section>

</main>
