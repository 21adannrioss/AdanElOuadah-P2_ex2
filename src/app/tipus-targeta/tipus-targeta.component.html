<!-- Targeta d'un tipus de Pokémon -->
<article class="h-full rounded-lg border-t-8 p-6 text-center shadow hover:shadow-lg" [class]="tipus().color">
  <h3 class="mt-3 text-xl font-semibold text-gray-800">{{tipus().nom}}</h3>
  <p class="mt-2 text-gray-600">{{tipus().descripcio}}</p>
  <p class="mt-3 text-sm font-bold text-gray-700">Inicial: {{tipus().inicial}}</p>
</article>
